<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Invoice | Rowshan Moving Company</title><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="shortcut icon" href="assets/favicon.ico"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="style.css"></head><body class="invoice-page">
<header class="site-header no-print"><a class="brand brand-logo" href="index.html" aria-label="Rowshan Moving Company Home"><img src="assets/rowshan-moving-logo.webp" alt="Rowshan Moving Company" class="brand-logo-img"><span class="brand-subtitle">Rowshan Moving Company</span></a><button class="menu-btn" id="menuBtn">Menu</button><nav class="nav" id="nav"><a href="index.html">Home</a><a href="services.html">Services</a><a href="rates.html">Pricing</a><a href="booking.html" class="nav-cta">Book Now / Get a Quote</a><a href="reviews.html">Reviews</a><a href="about.html">About Us</a><a href="contact.html">Contact Us</a><a href="gallery.html">Gallery</a></nav></header>
<main><section class="section invoice-public-wrap"><div id="invoiceLoading" class="notice">Loading invoice…</div><article id="invoiceDocument" class="invoice-document" hidden></article><div id="invoiceActions" class="invoice-public-actions no-print" hidden><button class="btn ghost dark" id="printInvoice">Print / Save PDF</button><button class="btn primary" id="copyInvoiceLink" type="button">Copy Invoice Link</button></div></section></main>
<footer class="footer no-print"><div class="footer-brand"><img src="assets/rowshan-moving-logo.webp" alt="Rowshan Moving Company" class="footer-logo"><p>1507–1507–2010 Ulster Road NW, Calgary, AB, Canada T2N 4C2, Canada T2N 4C2</p></div><div><a href="tel:+18254493050">(825) 449-3050</a><a href="mailto:lal@rowshanglobal.com">lal@rowshanglobal.com</a></div><div><a href="booking.html">Book Now</a><a href="payment.html">Invoice Payment</a></div></footer>
<script src="app.js"></script><script src="supabase-config.js"></script><script src="data-api.js"></script><script src="booking-app.js"></script><script>
(function(){
const q=new URLSearchParams(location.search),token=q.get('token')||'',loading=document.getElementById('invoiceLoading'),doc=document.getElementById('invoiceDocument'),actions=document.getElementById('invoiceActions');
const esc=RMC.escapeHtml,m=RMC.money;
const paymentEmails=['rowshan.1982@gmail.com','lal@rowshanglobal.com'];
function statusClass(s){return 'status-'+String(s||'').toLowerCase().replace(/\s+/g,'-')}
async function copyValue(value,button){try{await navigator.clipboard.writeText(value);const old=button.textContent;button.textContent='Copied!';setTimeout(()=>button.textContent=old,1400)}catch{window.prompt('Copy this value:',value)}}
function paymentCard(amount,status){const paid=String(status||'').toLowerCase()==='paid';if(paid)return `<div class="interac-payment-card"><span class="payment-method-badge">PAYMENT STATUS</span><h3>Invoice Paid</h3><p>This invoice is marked as paid. Thank you for choosing Rowshan Moving Company.</p></div>`;return `<div class="interac-payment-card no-print"><span class="payment-method-badge">INTERAC E-TRANSFER</span><h3>Payment instructions</h3><p>Please send the <strong>Total Due of ${m(amount)}</strong> by Interac e-Transfer to <strong>one</strong> of the authorized Rowshan Moving Company email addresses below.</p><div class="interac-email-list">${paymentEmails.map((email,idx)=>`<div class="interac-email-row"><strong>${esc(email)}</strong><button type="button" class="small-btn copy-email-btn" data-copy-email="${idx}">Copy Email</button></div>`).join('')}</div><p class="interac-warning">For your protection, send payment only to one of the two email addresses shown above.</p></div>`}
async function load(){if(!token){loading.textContent='This invoice link is incomplete. Please request a new invoice link from Rowshan Moving Company.';return}try{const r=await RMCData.rpc('get_public_invoice_by_token',{p_token:token});const i=Array.isArray(r)?r[0]:r;if(!i){loading.textContent='Invoice not found or the link is no longer valid.';return}const items=Array.isArray(i.items)?i.items:[];const amount=Number(i.subtotal ?? i.total_amount ?? i.final_amount ?? 0);doc.innerHTML=`<div class="invoice-brand-row"><div><img src="assets/rowshan-moving-logo.webp" alt="Rowshan Moving Company" class="invoice-logo"><p>Rowshan Moving Company<br>1507–1507–2010 Ulster Road NW, Calgary, AB, Canada T2N 4C2, Canada T2N 4C2<br><a href="tel:+18254493050">(825) 449-3050</a><br><a href="mailto:lal@rowshanglobal.com">lal@rowshanglobal.com</a></p></div><div class="invoice-heading"><span>INVOICE</span><h1>${esc(i.invoice_number)}</h1><span class="invoice-status ${statusClass(i.status)}">${esc(i.status)}</span></div></div><div class="invoice-meta-grid"><div><span>Bill To</span><strong>${esc(i.client_name||'Client')}</strong><p>${esc(i.client_email||'')}<br>${esc(i.client_phone||'')}</p></div><div><span>Invoice Date</span><strong>${esc(i.invoice_date||'')}</strong><span>Due Date</span><strong>${esc(i.due_date||'Upon receipt')}</strong></div>${i.booking_reference?`<div><span>Booking</span><strong>${esc(i.booking_reference)}</strong><span>Service Date</span><strong>${esc(i.service_date||'')}</strong></div>`:''}</div>${i.origin||i.destination?`<div class="invoice-route"><span>Service Route</span><strong>${esc(i.origin||'')} ${i.destination?'→ '+esc(i.destination):''}</strong></div>`:''}<div class="invoice-table-wrap"><table class="invoice-table"><thead><tr><th>Service / Description</th><th>Hours / Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td>${esc(x.description)}</td><td>${Number(x.qty)} ${esc(x.unit||'')}</td><td>${m(x.unit_rate)}</td><td>${m(x.line_total)}</td></tr>`).join(''):`<tr><td>Rowshan Moving Company services</td><td>—</td><td>—</td><td>${m(amount)}</td></tr>`}</tbody></table></div><div class="invoice-summary-box"><div class="invoice-grand"><span>Total Due</span><strong>${m(amount)}</strong></div></div>${i.note?`<div class="invoice-notes"><strong>Notes</strong><p>${esc(i.note)}</p></div>`:''}${paymentCard(amount,i.status)}<div class="invoice-thanks">Thank you for choosing Rowshan Moving Company.</div>`;loading.hidden=true;doc.hidden=false;actions.hidden=false;doc.querySelectorAll('[data-copy-email]').forEach(b=>b.onclick=()=>copyValue(paymentEmails[Number(b.dataset.copyEmail)],b))}catch(e){console.error(e);loading.innerHTML='<strong>Unable to load this invoice.</strong><br>Please contact Rowshan Moving Company for assistance.'}}
document.getElementById('printInvoice').onclick=()=>window.print();document.getElementById('copyInvoiceLink').onclick=e=>copyValue(location.href,e.currentTarget);load();
})();
</script></script></body></html>
